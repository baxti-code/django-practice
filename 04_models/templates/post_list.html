<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog Posts</title>
</head>
<body>
    <h1>All Posts</h1>
    {% for post in posts %}
        <h2><a href="/post/{{ post.pk }}/">{{ post.title }}</a></h2>
        <p>{{ post.content }}</p>
        <small>{{ post.created_at }}</small>
        <hr>
    {% endfor %}
</body>
</html>
