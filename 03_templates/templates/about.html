<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
</head>
<body>
    <h1>About me</h1>
    <h3>My skills :</h3>
    <ul>
        {% for skill in skills %}
        <li>
            {{skill}}
        </li>
        {% endfor %}
    </ul>
    {% if is_developer %}
        <p>I am a developer</p>
    {% else %}
        <p>Not a developer yet.</p>
    {% endif %}
</body>
</html>
